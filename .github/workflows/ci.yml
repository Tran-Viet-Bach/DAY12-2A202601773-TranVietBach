name: CI

# Chạy cả khi pull_request, không chỉ push: lỗi bị bắt TRƯỚC khi vào nhánh
# chính, không phải sau.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Chạy checkpoint trên máy sạch
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy pytest
        # Bỏ test_cp5.py (gọi vào bản deploy đang sống) và test_bonus_cicd.py
        # (kiểm tra badge của chính workflow này — tự tham chiếu vòng tròn).
        # -m "not docker" bỏ qua test build image, job `build` đã lo phần đó.
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  # ─────────────────────────────────────────────────────────────
  # 2. Build image trên môi trường sạch — bắt lỗi "máy tôi build được"
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Xem dung lượng image
        run: docker images day12-agent:ci --format "{{.Size}}"

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy — chỉ khi test và build đều xanh, và chỉ từ nhánh main
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # needs: đợi cả hai job trên PASS. Thiếu dòng này thì GitHub chạy song song
    # và code hỏng vẫn lên production trong khi test đang đỏ.
    needs: [test, build]
    # if: không có thì mỗi lần ai đó mở pull request là một lần deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Cài Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service agent --ci

      - name: Smoke test bản vừa deploy
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        # curl -f trả mã lỗi khi HTTP không phải 2xx → job đỏ ngay, thay vì chỉ
        # biết "lệnh deploy đã chạy xong".
        run: |
          sleep 45
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
